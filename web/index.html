<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grok Proxy Tester</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 h-screen overflow-hidden p-4">
    <main class="mx-auto flex h-[calc(100vh-2rem)] min-h-0 w-full max-w-6xl flex-col gap-4">
        <header class="flex flex-wrap items-end justify-between gap-3">
            <div>
                <h1 class="text-xl font-semibold text-zinc-100">Grok Bridge Tester</h1>
                <p class="text-xs text-zinc-500">Proxy: http://127.0.0.1:11434</p>
            </div>
            <div id="status" class="text-xs text-zinc-500">Ready</div>
        </header>

        <section class="rounded border border-zinc-800 bg-zinc-900">
            <div class="flex flex-wrap items-center justify-between gap-3 border-b border-zinc-800 px-4 py-3">
                <div>
                    <h2 class="text-sm font-medium text-zinc-200">Bridge Health</h2>
                    <div id="healthSummary" class="mt-1 text-xs text-zinc-500">Checking proxy...</div>
                </div>
                <div class="flex gap-2">
                    <button id="prewarmBtn" type="button"
                            class="rounded border border-sky-700 px-3 py-1 text-xs text-sky-200 hover:bg-sky-950">
                        Prewarm
                    </button>
                    <button id="refreshHealthBtn" type="button"
                            class="rounded border border-zinc-700 px-3 py-1 text-xs text-zinc-300 hover:bg-zinc-800">
                        Refresh
                    </button>
                </div>
            </div>
            <div id="healthGrid" class="grid gap-px bg-zinc-800 text-xs sm:grid-cols-3 lg:grid-cols-10"></div>
            <div id="healthDetail" class="border-t border-zinc-800 px-4 py-2 font-mono text-[11px] text-zinc-500"></div>
        </section>

        <section class="grid min-h-0 flex-1 gap-4 overflow-hidden lg:grid-cols-[280px_1fr_360px]">
            <aside id="chatSidebar" class="min-h-0 rounded border border-zinc-800 bg-zinc-900 flex flex-col">
                <div class="border-b border-zinc-800 px-4 py-3">
                    <button id="newChatBtn" type="button"
                            class="w-full rounded bg-sky-600 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-sky-500">
                        + New Chat
                    </button>
                </div>
                <div id="chatList" class="flex-1 overflow-auto divide-y divide-zinc-800">
                </div>
            </aside>

            <div id="output" class="min-h-0 w-full overflow-auto rounded border border-zinc-800 bg-zinc-900 p-4 font-mono text-sm leading-6"></div>

            <aside class="min-h-0 rounded border border-zinc-800 bg-zinc-900 flex flex-col overflow-hidden">
                <div class="border-b border-zinc-800 px-4 py-3">
                    <h2 class="text-sm font-medium text-zinc-200">Timing</h2>
                    <div id="summary" class="mt-1 text-xs text-zinc-500">No request yet</div>
                </div>
                <div id="timings" class="min-h-0 flex-1 overflow-auto divide-y divide-zinc-800 text-xs"></div>
            </aside>
        </section>

        <form id="promptForm" class="shrink-0 flex gap-2">
            <input type="text" id="prompt"
                   class="min-w-0 flex-1 rounded border border-zinc-700 bg-zinc-900 px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500"
                   placeholder="Enter prompt..."
                   autocomplete="off">
            <button id="sendBtn" type="submit"
                    class="rounded bg-sky-600 px-5 py-2 text-sm font-medium text-white transition-colors hover:bg-sky-500 disabled:cursor-not-allowed disabled:bg-zinc-700 disabled:text-zinc-400">
                Send
            </button>
        </form>
    </main>

    <script>
        const PROXY_URL = 'http://127.0.0.1:11434';
        const STORAGE_KEY = 'grok-chat-sessions';
        const MISSING_METADATA_WARNING = 'Warning: Grok returned a first response without continuation metadata. This chat cannot be continued; restart the proxy, create a new chat, and send the first prompt again.';
        const timingRows = [
            ['requestStartedAt', 'Client request started', 'client'],
            ['requestReceivedAt', 'Proxy request received', 'server'],
            ['jobQueuedAt', 'Job queued', 'server'],
            ['workerNotifiedAt', 'Worker notified', 'server'],
            ['workerAcceptedAt', 'Worker accepted', 'server'],
            ['streamHeadersFlushedAt', 'SSE headers flushed', 'server'],
            ['jobAssignedAt', 'Job assigned', 'server'],
            ['contentScriptAcceptedAt', 'Content script accepted', 'server'],
            ['grokFetchStartedAt', 'Grok fetch started', 'server'],
            ['grokResponseHeadersAt', 'Grok response headers', 'server'],
            ['firstRawUpstreamChunkAt', 'First raw upstream chunk', 'server'],
            ['firstParsedNonThinkingTokenAt', 'First parsed visible token', 'server'],
            ['firstSseChunkAt', 'First proxy SSE chunk', 'server'],
            ['firstSseChunkReceivedAt', 'First SSE chunk received', 'client'],
            ['firstVisibleTokenAt', 'First visible token rendered', 'client'],
            ['doneAt', 'Stream completed', 'client'],
        ];

        const form = document.getElementById('promptForm');
        const promptInput = document.getElementById('prompt');
        const outputDiv = document.getElementById('output');
        const sendBtn = document.getElementById('sendBtn');
        const statusDiv = document.getElementById('status');
        const timingsDiv = document.getElementById('timings');
        const summaryDiv = document.getElementById('summary');
        const healthSummaryDiv = document.getElementById('healthSummary');
        const healthGridDiv = document.getElementById('healthGrid');
        const healthDetailDiv = document.getElementById('healthDetail');
        const refreshHealthBtn = document.getElementById('refreshHealthBtn');
        const prewarmBtn = document.getElementById('prewarmBtn');
        const newChatBtn = document.getElementById('newChatBtn');
        const chatList = document.getElementById('chatList');

        let clientMarks = {};
        let serverMarks = {};
        let lastHealth = null;
        let chatSessions = [];
        let currentChatId = null;

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        }

        function loadChatSessions() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    const parsed = JSON.parse(stored);
                    chatSessions = Array.isArray(parsed) ? parsed.map(normalizeChatSession).filter(Boolean) : [];
                    sortChatSessions();
                    saveChatSessions();
                }
            } catch {
                chatSessions = [];
            }
        }

        function normalizeChatSession(value) {
            if (!value || typeof value !== 'object' || typeof value.id !== 'string') {
                return null;
            }

            const now = Date.now();
            const messages = Array.isArray(value.messages) ? value.messages.map(normalizeChatMessage).filter(Boolean) : [];
            return {
                id: value.id,
                title: typeof value.title === 'string' && value.title.trim() ? value.title : 'New Chat',
                conversationId: typeof value.conversationId === 'string' && value.conversationId ? value.conversationId : null,
                parentResponseId: typeof value.parentResponseId === 'string' && value.parentResponseId ? value.parentResponseId : null,
                messages,
                createdAt: typeof value.createdAt === 'number' ? value.createdAt : now,
                updatedAt: typeof value.updatedAt === 'number' ? value.updatedAt : now,
            };
        }

        function normalizeChatMessage(value) {
            if (!value || typeof value !== 'object') {
                return null;
            }

            const role = value.role === 'assistant' ? 'assistant' : 'user';
            return {
                role,
                content: typeof value.content === 'string' ? value.content : String(value.content || ''),
                reasoning: typeof value.reasoning === 'string' ? value.reasoning : '',
                createdAt: typeof value.createdAt === 'number' ? value.createdAt : Date.now(),
            };
        }

        function saveChatSessions() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(chatSessions));
            } catch {
            }
        }

        function sortChatSessions() {
            chatSessions.sort((left, right) => right.updatedAt - left.updatedAt);
        }

        function createNewChat() {
            const chat = {
                id: generateId(),
                title: 'New Chat',
                conversationId: null,
                parentResponseId: null,
                messages: [],
                createdAt: Date.now(),
                updatedAt: Date.now(),
            };
            chatSessions.unshift(chat);
            saveChatSessions();
            selectChat(chat.id);
            renderChatList();
            return chat;
        }

        function selectChat(chatId) {
            const previousChatId = currentChatId;
            currentChatId = chatId;
            if (previousChatId !== chatId) {
                clientMarks = {};
                serverMarks = {};
                renderTimings();
                summaryDiv.innerText = 'No request yet';
            }
            renderTranscript();
            renderChatList();
        }

        function getCurrentChat() {
            return chatSessions.find(c => c.id === currentChatId) || null;
        }

        function updateChat(chatId, updates) {
            const chat = chatSessions.find(c => c.id === chatId);
            if (chat) {
                Object.assign(chat, updates, { updatedAt: Date.now() });
                sortChatSessions();
                saveChatSessions();
                renderChatList();
            }
        }

        function appendChatMessage(chatId, role, content) {
            const chat = chatSessions.find(c => c.id === chatId);
            if (!chat) {
                return -1;
            }

            const messages = Array.isArray(chat.messages) ? chat.messages : [];
            chat.messages = messages;
            const index = messages.length;
            messages.push({
                role: role === 'assistant' ? 'assistant' : 'user',
                content: String(content || ''),
                reasoning: '',
                createdAt: Date.now(),
            });
            chat.updatedAt = Date.now();
            sortChatSessions();
            saveChatSessions();
            renderChatList();
            if (currentChatId === chatId) {
                renderTranscript();
            }
            return index;
        }

        function updateChatMessage(chatId, messageIndex, updater) {
            const chat = chatSessions.find(c => c.id === chatId);
            if (!chat || !Array.isArray(chat.messages) || !chat.messages[messageIndex]) {
                return;
            }

            const message = chat.messages[messageIndex];
            message.content = typeof updater === 'function' ? updater(message.content || '') : String(updater || '');
            chat.updatedAt = Date.now();
            saveChatSessions();
            renderChatList();
            if (currentChatId === chatId) {
                renderTranscript();
            }
        }

        function updateChatReasoning(chatId, messageIndex, updater) {
            const chat = chatSessions.find(c => c.id === chatId);
            if (!chat || !Array.isArray(chat.messages) || !chat.messages[messageIndex]) {
                return;
            }

            const message = chat.messages[messageIndex];
            message.reasoning = typeof updater === 'function' ? updater(message.reasoning || '') : String(updater || '');
            chat.updatedAt = Date.now();
            saveChatSessions();
            renderChatList();
            if (currentChatId === chatId) {
                renderTranscript();
            }
        }

        function renderTranscript(chat = getCurrentChat()) {
            if (!chat || !Array.isArray(chat.messages) || chat.messages.length === 0) {
                outputDiv.innerHTML = '';
                return;
            }

            outputDiv.innerHTML = chat.messages.map((message) => {
                const label = message.role === 'assistant' ? 'Assistant' : 'User';
                const reasoning = message.role === 'assistant' && message.reasoning
                    ? `<div class="mb-2 whitespace-pre-wrap text-zinc-500">${escapeHtml(message.reasoning)}</div>`
                    : '';
                return `
                    <div class="mb-4 last:mb-0">
                        <div class="mb-1 text-[11px] uppercase tracking-normal text-zinc-500">${label}</div>
                        ${reasoning}
                        <div class="text-zinc-100 whitespace-pre-wrap">${escapeHtml(message.content || '')}</div>
                    </div>
                `;
            }).join('');
            outputDiv.scrollTop = outputDiv.scrollHeight;
        }

        function generateTitle(prompt) {
            const text = typeof prompt === 'string' ? prompt : String(prompt || '');
            const truncated = text.slice(0, 30).trim();
            return truncated || 'New Chat';
        }

        function renderChatList() {
            if (chatSessions.length === 0) {
                chatList.innerHTML = '<div class="px-4 py-3 text-xs text-zinc-500">No chats yet</div>';
                return;
            }

            chatList.innerHTML = chatSessions.map(chat => {
                const isActive = chat.id === currentChatId;
                const title = chat.title || 'New Chat';
                const time = formatTimeAgo(chat.updatedAt);

                return `
                    <button type="button" data-chat-id="${chat.id}"
                            class="w-full text-left px-4 py-3 hover:bg-zinc-800 transition-colors ${isActive ? 'bg-zinc-800' : ''}">
                        <div class="text-sm font-medium text-zinc-200 truncate">${escapeHtml(title)}</div>
                        <div class="text-xs text-zinc-500 mt-0.5">${time}</div>
                    </button>
                `;
            }).join('');

            chatList.querySelectorAll('button[data-chat-id]').forEach(btn => {
                btn.addEventListener('click', () => {
                    selectChat(btn.dataset.chatId);
                });
            });
        }

        function formatTimeAgo(timestamp) {
            const seconds = Math.floor((Date.now() - timestamp) / 1000);
            if (seconds < 60) return 'just now';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h ago`;
            const days = Math.floor(hours / 24);
            return `${days}d ago`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        form.addEventListener('submit', (event) => {
            event.preventDefault();
            void send();
        });
        refreshHealthBtn.addEventListener('click', () => {
            void refreshHealth();
        });
        prewarmBtn.addEventListener('click', () => {
            void prewarmBridge();
        });
        newChatBtn.addEventListener('click', () => {
            void createNewChat();
            promptInput.focus();
        });

        loadChatSessions();
        renderTimings();
        renderHealth(null);
        void refreshHealth();
        setInterval(() => {
            void refreshHealth();
        }, 2000);

        if (chatSessions.length > 0) {
            selectChat(chatSessions[0].id);
        } else {
            createNewChat();
        }
        renderChatList();

        async function send() {
            const prompt = promptInput.value.trim();
            if (!prompt) {
                return;
            }

            if (lastHealth?.bridge?.warmReady !== true) {
                const proceed = window.confirm('Grok bridge is not warm-ready. Send anyway?');
                if (!proceed) {
                    return;
                }
            }

            let chat = getCurrentChat();
            if (!chat) {
                chat = createNewChat();
            }

            const sentChatId = chat.id;
            const hasMessages = Array.isArray(chat.messages) && chat.messages.length > 0;
            const hasAnyContinuationMetadata = Boolean(chat.conversationId || chat.parentResponseId);
            const canContinueChat = Boolean(chat.conversationId && chat.parentResponseId);
            const shouldCreateRemoteConversation = !hasMessages && !hasAnyContinuationMetadata;

            if (chat.title === 'New Chat') {
                updateChat(sentChatId, { title: generateTitle(prompt) });
            }

            appendChatMessage(sentChatId, 'user', prompt);
            promptInput.value = '';
            sendBtn.disabled = true;
            sendBtn.innerText = '...';
            clientMarks = {};
            serverMarks = {};

            if (!shouldCreateRemoteConversation && !canContinueChat) {
                const message = 'Cannot continue this chat because it is missing Grok conversation metadata.';
                appendChatMessage(sentChatId, 'assistant', `Error: ${message}`);
                statusDiv.innerText = 'Error';
                sendBtn.disabled = false;
                sendBtn.innerText = 'Send';
                renderTimings();
                return;
            }

            const assistantMessageIndex = appendChatMessage(sentChatId, 'assistant', '');
            statusDiv.innerText = 'Streaming';
            markClient('requestStartedAt');

            try {
                const modelToUse = shouldCreateRemoteConversation ? 'grok-latest-new' : 'grok-latest';
                const requestBody = {
                    model: modelToUse,
                    messages: [{ role: 'user', content: prompt }],
                    stream: true,
                };

                if (!shouldCreateRemoteConversation) {
                    requestBody.conversationId = chat.conversationId;
                    requestBody.parentResponseId = chat.parentResponseId;
                }

                const response = await fetch(`${PROXY_URL}/v1/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Grok-Debug-Timing': '1',
                    },
                    body: JSON.stringify(requestBody),
                });
                markClient('responseHeadersReceivedAt');

                const jobId = response.headers.get('X-Grok-Job-Id');
                if (jobId) {
                    statusDiv.innerText = `Streaming ${jobId.slice(0, 8)}`;
                }

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${await response.text()}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) {
                        break;
                    }

                    markClient('firstSseChunkReceivedAt');
                    buffer += decoder.decode(value, { stream: true });
                    buffer = processSseBuffer(buffer, false, sentChatId, assistantMessageIndex);
                }

                buffer += decoder.decode();
                processSseBuffer(buffer, true, sentChatId, assistantMessageIndex);
                markClient('doneAt');
                const completedChat = chatSessions.find(c => c.id === sentChatId);
                if (shouldCreateRemoteConversation && (!completedChat?.conversationId || !completedChat?.parentResponseId)) {
                    updateChatMessage(sentChatId, assistantMessageIndex, (content) => {
                        return content ? `${content}\n\n${MISSING_METADATA_WARNING}` : MISSING_METADATA_WARNING;
                    });
                    statusDiv.innerText = 'Warning';
                } else {
                    statusDiv.innerText = 'Done';
                }
            } catch (err) {
                const message = err instanceof Error ? err.message : String(err);
                updateChatMessage(sentChatId, assistantMessageIndex, (content) => {
                    return content ? `${content}\n\nError: ${message}` : `Error: ${message}`;
                });
                statusDiv.innerText = 'Error';
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerText = 'Send';
                renderTimings();
                void refreshHealth();
            }
        }

        async function refreshHealth() {
            try {
                const response = await fetch(`${PROXY_URL}/health`, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                lastHealth = await response.json();
                renderHealth(lastHealth);
            } catch (err) {
                const message = err instanceof Error ? err.message : String(err);
                lastHealth = null;
                renderHealth(null, message);
            }
        }

        async function prewarmBridge() {
            prewarmBtn.disabled = true;
            prewarmBtn.innerText = '...';
            try {
                const response = await fetch(`${PROXY_URL}/bridge/prewarm`, { method: 'POST' });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${await response.text()}`);
                }
                statusDiv.innerText = 'Prewarm sent';
            } catch (err) {
                const message = err instanceof Error ? err.message : String(err);
                statusDiv.innerText = `Prewarm failed: ${message}`;
            } finally {
                prewarmBtn.disabled = false;
                prewarmBtn.innerText = 'Prewarm';
                void refreshHealth();
            }
        }

        function renderHealth(health, errorMessage = '') {
            const bridge = health?.bridge || {};
            const jobs = health?.jobs || {};
            const metrics = health?.metrics || {};
            const ready = bridge.warmReady === true;
            const requiredBackground = bridge.requiredBackgroundCodeVersion || '';
            const backgroundMatches = !requiredBackground || bridge.backgroundCodeVersion === requiredBackground;

            if (errorMessage) {
                healthSummaryDiv.innerText = `Proxy unavailable: ${errorMessage}`;
                healthSummaryDiv.className = 'mt-1 text-xs text-red-400';
            } else if (ready) {
                healthSummaryDiv.innerText = 'Warm-ready: extension, Grok tab, template, and fast channel are ready';
                healthSummaryDiv.className = 'mt-1 text-xs text-emerald-400';
            } else if (bridge.fallbackReady === true) {
                healthSummaryDiv.innerText = 'Fallback-ready: push channel is cold, polling fallback can accept requests';
                healthSummaryDiv.className = 'mt-1 text-xs text-amber-400';
            } else if (health) {
                const missing = [];
                if (bridge.connected !== true) missing.push('extension heartbeat');
                if (bridge.connected === true && !backgroundMatches) missing.push(`extension ${requiredBackground}`);
                if (bridge.fastPath?.enabled === true && bridge.controlChannelConnected !== true) missing.push('push channel');
                if (bridge.activeGrokTab !== true) missing.push('active Grok tab');
                if (bridge.hasRequestTemplate !== true) missing.push('request template');
                healthSummaryDiv.innerText = `Not ready: missing ${missing.join(', ') || 'unknown bridge state'}`;
                healthSummaryDiv.className = 'mt-1 text-xs text-amber-400';
            } else {
                healthSummaryDiv.innerText = 'Checking proxy...';
                healthSummaryDiv.className = 'mt-1 text-xs text-zinc-500';
            }

            healthGridDiv.innerHTML = [
                healthCell('Proxy', errorMessage ? 'down' : health ? 'up' : '-', !errorMessage && Boolean(health)),
                healthCell('Extension', boolText(bridge.connected), bridge.connected === true),
                healthCell('Version', bridge.backgroundCodeVersion || '-', backgroundMatches),
                healthCell('Fast Path', bridge.fastPath?.enabled === true ? 'on' : 'off', bridge.fastPath?.enabled === true),
                healthCell('Push', boolText(bridge.controlChannelConnected), bridge.fastPath?.enabled !== true || bridge.controlChannelConnected === true),
                healthCell('Grok Tab', boolText(bridge.activeGrokTab), bridge.activeGrokTab === true),
                healthCell('Template', boolText(bridge.hasRequestTemplate), bridge.hasRequestTemplate === true),
                healthCell('Native', valueText(bridge.nativeTimingSamples), (bridge.nativeTimingSamples || 0) > 0),
                healthCell('Queued', valueText(jobs.queued), jobs.queued === 0),
                healthCell('Failed', valueText(metrics.failedJobs), (metrics.failedJobs || 0) === 0),
            ].join('');

            const detail = [];
            if (bridge.ageMs !== undefined && bridge.ageMs !== null) {
                detail.push(`heartbeatAge=${bridge.ageMs}ms`);
            }
            if (bridge.workerId) {
                detail.push(`worker=${bridge.workerId}`);
            }
            if (Array.isArray(bridge.connectedWorkerIds)) {
                detail.push(`pushWorkers=${bridge.connectedWorkerIds.length}`);
            }
            if (bridge.fastPath) {
                detail.push(`fastPath=${bridge.fastPath.enabled ? 'on' : 'off'}`);
                detail.push(`pollFallback=${bridge.fastPath.pollingFallbackEnabled ? 'on' : 'off'}`);
            }
            if (bridge.url) {
                detail.push(`template=${bridge.url}`);
            }
            if (bridge.extensionHasRequestTemplate !== undefined) {
                detail.push(`extensionTemplate=${boolText(bridge.extensionHasRequestTemplate)}`);
            }
            if (bridge.proxyHasTemplateOverride !== undefined) {
                detail.push(`proxyTemplate=${boolText(bridge.proxyHasTemplateOverride)}`);
            }
            if (bridge.manifestVersion) {
                detail.push(`manifest=${bridge.manifestVersion}`);
            }
            if (bridge.backgroundCodeVersion) {
                detail.push(`background=${bridge.backgroundCodeVersion}`);
            }
            if (requiredBackground) {
                detail.push(`requiredBackground=${requiredBackground}`);
            }
            if (bridge.templateInstallSource) {
                detail.push(`templateSource=${bridge.templateInstallSource}`);
            }
            if (bridge.templateInstallError) {
                detail.push(`templateError=${bridge.templateInstallError}`);
            }
            if (bridge.latestNativeTiming?.timings) {
                const native = bridge.latestNativeTiming.timings;
                if (typeof native.nativeFetchStartedAt === 'number' && typeof native.nativeFirstParsedVisibleTokenAt === 'number') {
                    detail.push(`nativeTTFT=${native.nativeFirstParsedVisibleTokenAt - native.nativeFetchStartedAt}ms`);
                }
                if (bridge.latestNativeTiming.status !== undefined && bridge.latestNativeTiming.status !== null) {
                    detail.push(`nativeStatus=${bridge.latestNativeTiming.status}`);
                }
            }
            if (health) {
                detail.push(`activeJobs=${valueText(jobs.active)}`);
                detail.push(`created=${valueText(metrics.createdJobs)}`);
                detail.push(`completed=${valueText(metrics.completedJobs)}`);
                detail.push(`rawChunks=${valueText(metrics.rawChunks)}`);
                detail.push(`tokens=${valueText(metrics.emittedTokens)}`);
                detail.push(`nativeSamples=${valueText(metrics.nativeTimingSamples)}`);
            }
            healthDetailDiv.innerText = detail.join('  ');
        }

        function healthCell(label, value, ok) {
            const color = ok ? 'text-emerald-400' : value === '-' ? 'text-zinc-500' : 'text-amber-400';
            return `
                <div class="bg-zinc-900 px-4 py-3">
                    <div class="text-[11px] uppercase tracking-normal text-zinc-500">${label}</div>
                    <div class="mt-1 font-mono ${color}">${value}</div>
                </div>`;
        }

        function boolText(value) {
            if (value === true) return 'true';
            if (value === false) return 'false';
            return '-';
        }

        function valueText(value) {
            return typeof value === 'number' ? String(value) : '-';
        }

        function processSseBuffer(buffer, flush = false, chatId = currentChatId, assistantMessageIndex = -1) {
            const parts = buffer.split(/\r?\n\r?\n/);
            const remainder = flush ? '' : parts.pop() || '';

            for (const part of parts) {
                handleSseFrame(part, chatId, assistantMessageIndex);
            }

            if (flush && parts.length === 0 && buffer.trim()) {
                handleSseFrame(buffer, chatId, assistantMessageIndex);
            }

            return remainder;
        }

        function handleSseFrame(frame, chatId = currentChatId, assistantMessageIndex = -1) {
            const lines = frame.split('\n').map((line) => line.replace(/\r$/, ''));
            let eventName = 'message';
            const dataLines = [];

            for (const line of lines) {
                if (line.startsWith('event:')) {
                    eventName = line.slice(6).trim();
                    continue;
                }
                if (line.startsWith('data:')) {
                    dataLines.push(line.slice(5).trimStart());
                }
            }

            if (dataLines.length === 0) {
                return;
            }

            const data = dataLines.join('\n');
            if (eventName === 'grok-timing') {
                mergeServerTiming(JSON.parse(data));
                return;
            }

            if (eventName === 'grok-response-metadata') {
                const metadata = JSON.parse(data);
                const updates = {};
                if (metadata.conversationId) {
                    updates.conversationId = metadata.conversationId;
                }
                if (metadata.responseId) {
                    updates.parentResponseId = metadata.responseId;
                }
                if (Object.keys(updates).length > 0) {
                    updateChat(chatId, updates);
                }
                return;
            }

            if (eventName === 'error') {
                const payload = JSON.parse(data);
                throw new Error(payload.error?.message || data);
            }

            if (data === '[DONE]') {
                return;
            }

            const json = JSON.parse(data);
            const delta = json.choices?.[0]?.delta || {};
            const reasoning = delta.reasoning_content || delta.reasoning || '';
            if (reasoning) {
                markClient('firstVisibleTokenAt');
                updateChatReasoning(chatId, assistantMessageIndex, (current) => `${current || ''}${reasoning}`);
            }

            const content = delta.content || '';
            if (content) {
                markClient('firstVisibleTokenAt');
                updateChatMessage(chatId, assistantMessageIndex, (current) => `${current || ''}${content}`);
            }
        }

        function mergeServerTiming(snapshot) {
            const timings = snapshot && snapshot.timings && typeof snapshot.timings === 'object' ? snapshot.timings : {};
            for (const [name, value] of Object.entries(timings)) {
                if (value && typeof value.at === 'number' && serverMarks[name] === undefined) {
                    serverMarks[name] = value.at;
                }
            }
            renderTimings();
        }

        function markClient(name) {
            if (clientMarks[name] === undefined) {
                clientMarks[name] = Date.now();
                renderTimings();
            }
        }

        function renderTimings() {
            const start = clientMarks.requestStartedAt;
            let previousAt = null;
            let visibleTokenMs = null;
            let upstreamMs = null;

            const rows = timingRows.map(([name, label, source]) => {
                const at = source === 'client' ? clientMarks[name] : serverMarks[name];
                const fromStart = start && at ? at - start : null;
                const delta = at && previousAt ? at - previousAt : null;
                if (at) {
                    previousAt = at;
                }
                if (name === 'firstVisibleTokenAt') {
                    visibleTokenMs = fromStart;
                }
                if (name === 'firstParsedNonThinkingTokenAt') {
                    upstreamMs = fromStart;
                }

                return `
                    <div class="grid grid-cols-[1fr_68px_68px] gap-2 px-4 py-2">
                        <div class="truncate text-zinc-300" title="${label}">${label}</div>
                        <div class="text-right font-mono ${fromStart === null ? 'text-zinc-600' : 'text-zinc-200'}">${formatMs(fromStart)}</div>
                        <div class="text-right font-mono ${delta === null ? 'text-zinc-600' : 'text-zinc-400'}">${formatDelta(delta)}</div>
                    </div>`;
            }).join('');

            timingsDiv.innerHTML = rows || '';
            if (visibleTokenMs !== null) {
                summaryDiv.innerText = `TTFT ${visibleTokenMs} ms${upstreamMs !== null ? `, bridge visible overhead ${visibleTokenMs - upstreamMs} ms` : ''}`;
            } else if (start) {
                summaryDiv.innerText = 'Waiting for first visible token';
            } else {
                summaryDiv.innerText = 'No request yet';
            }
        }

        function formatMs(value) {
            return value === null ? '-' : `${value} ms`;
        }

        function formatDelta(value) {
            return value === null ? '-' : `+${value} ms`;
        }
    </script>
</body>
</html>
